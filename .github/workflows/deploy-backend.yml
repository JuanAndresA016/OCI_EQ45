name: Deploy Backend Blue/Green to OKE

on:
  push:
    branches:
      - main
    paths:
      - "backend/mazetasks/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login ${{ secrets.OCIR_REGISTRY }} \
            -u "${{ secrets.OCIR_USERNAME }}" \
            --password-stdin

      - name: Build backend JAR
        working-directory: backend/mazetasks
        run: |
          mvn clean package -DskipTests

      - name: Build and push Docker image
        working-directory: backend/mazetasks
        run: |
          IMAGE=${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/mazetasks-backend:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Configure kubectl for OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OCI_CLUSTER_OCID }}

      - name: Detect active color
        run: |
          ACTIVE_COLOR=$(kubectl get svc mazetasks-backend-service -o jsonpath='{.spec.selector.color}')

          if [ "$ACTIVE_COLOR" = "blue" ]; then
            TARGET_COLOR="green"
            TARGET_DEPLOYMENT="mazetasks-backend-green"
          else
            TARGET_COLOR="blue"
            TARGET_DEPLOYMENT="mazetasks-backend"
          fi

          echo "ACTIVE_COLOR=$ACTIVE_COLOR" >> $GITHUB_ENV
          echo "TARGET_COLOR=$TARGET_COLOR" >> $GITHUB_ENV
          echo "TARGET_DEPLOYMENT=$TARGET_DEPLOYMENT" >> $GITHUB_ENV

          echo "Active color: $ACTIVE_COLOR"
          echo "Deploying to: $TARGET_COLOR"
          echo "Target deployment: $TARGET_DEPLOYMENT"

      - name: Deploy new image to inactive color
        run: |
          kubectl set image deployment/$TARGET_DEPLOYMENT mazetasks-backend=$IMAGE
          kubectl rollout status deployment/$TARGET_DEPLOYMENT

      - name: Switch traffic to new color
        run: |
          kubectl patch svc mazetasks-backend-service \
            -p "{\"spec\":{\"selector\":{\"app\":\"mazetasks-backend\",\"color\":\"$TARGET_COLOR\"}}}"

          echo "Traffic switched from $ACTIVE_COLOR to $TARGET_COLOR"

      - name: Verify active backend
        run: |
          kubectl get svc mazetasks-backend-service -o yaml | grep -A4 selector
          kubectl get pods --show-labels
